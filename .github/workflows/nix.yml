name: Nix

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - flake.nix
      - flake.lock
      - .github/workflows/nix.yml

# Validation is read-only, including on pull requests from upstream.
permissions:
  contents: read

defaults:
  run:
    shell: bash -Eeuo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build flake
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2

      # A stale vendorHash fails validation; update it in a reviewed change.
      - name: Build flake
        run: nix build -L .#packages.x86_64-linux.default
