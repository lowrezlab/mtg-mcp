name: Upstream sync API probe

# Validation-only branch version of the registered sync workflow.
# Creates one draft against a nonproduction base; no checkout, main push or deploy.

on: # yamllint disable-line rule:truthy
  workflow_dispatch: # Manual trigger

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash -Eeuo pipefail {0}

jobs:
  sync:
    name: Open PR for new upstream commits
    if: github.repository == 'lowrezlab/mtg-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SYNC_BASE: repair/sync-api-probe-base-20261117
      UPSTREAM_OWNER: nathanmartins
      UPSTREAM_REPO: nathanmartins/mtg-mcp

    steps:
      - name: Compare main with upstream
        id: compare
        run: |
          ahead=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SYNC_BASE}...${UPSTREAM_OWNER}:main" --jq .ahead_by)
          echo "Upstream main has ${ahead} commit(s) not in ${GITHUB_REPOSITORY} main"
          echo "ahead=${ahead}" >> "$GITHUB_OUTPUT"

      - name: Open sync PR
        if: steps.compare.outputs.ahead != '0'
        run: |
          open=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=${SYNC_BASE}&head=${UPSTREAM_OWNER}:main" \
            --jq length)
          if [[ "${open}" != "0" ]]; then
            echo "A sync PR is already open; it updates itself as upstream moves."
            exit 0
          fi
          body="Validation-only draft for maintainer_can_modify=false with the repository Actions token. Targets the isolated ${SYNC_BASE} base. No merge or deployment is requested."
          gh api "repos/${GITHUB_REPOSITORY}/pulls" \
            -f base="${SYNC_BASE}" \
            -f head="${UPSTREAM_OWNER}:main" \
            -F maintainer_can_modify=false \
            -F draft=true \
            -f title="API validation only: upstream sync permission repair" \
            -f body="${body}" \
            --jq .html_url
