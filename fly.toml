# Fly.io deployment of the hosted (Streamable HTTP) MTG Commander MCP server.
#
#   fly apps create lowrezlab-mtg-mcp
#   fly secrets set MCP_PATH_SECRET=$(openssl rand -hex 24) --stage
#   fly deploy --ha=false
#
# Connector URL: https://lowrezlab-mtg-mcp.fly.dev/mcp/<MCP_PATH_SECRET>
#
# Exactly one machine, always on: MCP sessions live in memory, so a second
# machine (Fly's default HA pair) or a stopped one would drop sessions.

app = "lowrezlab-mtg-mcp"
primary_region = "iad"

[build]
  dockerfile = "docker/Dockerfile"
  build-target = "http"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
